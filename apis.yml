name: Transposon Therapeutics
description: >-
  Transposon Therapeutics, Inc. is a clinical-stage biopharmaceutical company
  developing transformational therapies for neurodegenerative and aging-related
  diseases driven by LINE-1 retrotransposon activity. Its lead asset, TPN-101
  (censavudine), is a potent oral inhibitor of LINE-1 reverse transcriptase in
  late-stage development for progressive supranuclear palsy (PSP), amyotrophic
  lateral sclerosis (ALS) / frontotemporal dementia (FTD), and Alzheimer's
  disease. The pipeline also includes follow-on novel nucleoside reverse
  transcriptase inhibitors (NRTIs) and Protein Kinase R inhibitors (PKRi)
  targeting pathways activated by LINE-1 and implicated in cognitive impairment.
  Surfaced as a portfolio company of Canaan Partners and added to the API
  Evangelist network; enrichment found a corporate marketing website only and no
  public API, developer, or machine-readable surface.
